name: command-center-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall app

      - name: Import decision engine
        run: python -c "import app.core; print(app.core.__file__)"

      - name: Smoke-check mastery calculation
        run: |
          python - <<'PY'
          import pandas as pd
          from app.core import calculate_skill_mastery
          sample = pd.DataFrame([{
              "recall": 80,
              "application": 60,
              "discrimination": 40,
              "retention": 100,
          }])
          result = calculate_skill_mastery(sample)
          value = float(result.loc[0, "mastery"])
          print("mastery=", value)
          assert abs(value - 66.0) < 1e-9, value
          PY

      - name: Run pytest with captured diagnostics
        id: pytest
        shell: bash
        run: |
          set +e
          pytest -vv tests/test_core.py > pytest-output.txt 2>&1
          code=$?
          cat pytest-output.txt
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics-${{ github.run_id }}
          path: pytest-output.txt
          if-no-files-found: warn
