name: command-center-ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile application
        run: python -m compileall app

      - name: Import decision engine
        run: python -c "import app.core; print(app.core.__file__)"

      - name: Test mastery formula
        run: pytest -q tests/test_core.py::test_mastery_formula

      - name: Test blueprint weighted readiness
        run: pytest -q tests/test_core.py::test_readiness_is_blueprint_weighted

      - name: Test high-confidence priority
        run: pytest -q tests/test_core.py::test_high_confidence_errors_are_prioritized

      - name: Test retention due
        run: pytest -q tests/test_core.py::test_retention_due_respects_date_and_state

      - name: Test H0 gates
        run: pytest -q tests/test_core.py -k "h0"

      - name: Test next best action
        run: pytest -q tests/test_core.py -k "next_action"

      - name: Full test suite
        run: pytest -q
